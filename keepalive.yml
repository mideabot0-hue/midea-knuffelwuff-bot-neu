name: Zeitplan aktiv halten

on:
  workflow_dispatch:
  schedule:
    # Ein kleiner Repository-Commit pro Monat verhindert die automatische
    # Deaktivierung geplanter Workflows nach langer Inaktivität.
    - cron: "13 3 1 * *"

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Aktivitätsdatei aktualisieren
        shell: bash
        run: |
          date -u +"Letzte automatische Aktivierung: %Y-%m-%dT%H:%M:%SZ" > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || git commit -m "Automatische Workflow-Aktivierung"
          git push
